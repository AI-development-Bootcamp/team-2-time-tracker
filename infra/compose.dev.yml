version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: timetracker-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-timetracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: infra/docker/server.dev.Dockerfile
    container_name: timetracker-server-dev

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timetracker}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-timetracker}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174

      # IDrive E2 Storage Configuration
      IDRIVE_ACCESS_KEY: ${IDRIVE_ACCESS_KEY}
      IDRIVE_SECRET_KEY: ${IDRIVE_SECRET_KEY}
      IDRIVE_BUCKET: ${IDRIVE_BUCKET}
      IDRIVE_ENDPOINT: ${IDRIVE_ENDPOINT}
      IDRIVE_REGION: ${IDRIVE_REGION:-eu-central-2}

    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../server/src:/app/server/src
      - ../server/prisma:/app/server/prisma
      - ../shared:/app/shared

volumes:
  postgres_dev_data:

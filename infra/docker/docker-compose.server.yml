services:
  postgres:
    image: postgres:16-alpine
    container_name: time-tracker-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: timetracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d timetracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../..
      dockerfile: infra/docker/server.Dockerfile
    container_name: time-tracker-server
    env_file:
      - ../../server/.env
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/timetracker?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

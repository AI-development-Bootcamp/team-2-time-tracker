version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: timetracker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-timetracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    container_name: timetracker-server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timetracker}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-timetracker}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /app/server/node_modules

  admin:
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: timetracker-admin
    ports:
      - "5173:80"
    depends_on:
      - server

  employee:
    build:
      context: ..
      dockerfile: infra/docker/employee.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: timetracker-employee
    ports:
      - "5174:80"
    depends_on:
      - server

volumes:
  postgres_data:

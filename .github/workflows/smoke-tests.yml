name: Smoke Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Critical Path Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker123
          POSTGRES_DB: timetracker_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://timetracker:timetracker123@localhost:5432/timetracker_smoke
      NODE_ENV: test
      JWT_SECRET: smoke-test-secret-key-12345678
      JWT_REFRESH_SECRET: smoke-test-refresh-secret-12345678

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @shared/types build

      - name: Prisma generate
        run: pnpm --filter server prisma generate

      - name: Run database migrations
        run: pnpm --filter server prisma migrate deploy

      - name: Build server
        run: pnpm --filter server build

      - name: Start server
        run: |
          pnpm --filter server start &
          echo $! > server.pid
          sleep 5

      - name: SMOKE TEST - Health Check
        run: |
          response=$(curl -f -s http://localhost:3000/health || echo "FAILED")
          if [ "$response" = "FAILED" ]; then
            echo "❌ Health check failed"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: SMOKE TEST - API Root
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api)
          if [ "$status" != "200" ] && [ "$status" != "404" ]; then
            echo "❌ API root check failed with status $status"
            exit 1
          fi
          echo "✅ API root accessible (status: $status)"

      - name: SMOKE TEST - Database Connection
        run: |
          pnpm --filter server exec node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            prisma.\$queryRaw\`SELECT 1\`.then(() => {
              console.log('✅ Database connection successful');
              process.exit(0);
            }).catch(err => {
              console.error('❌ Database connection failed:', err);
              process.exit(1);
            });
          "

      - name: SMOKE TEST - Critical Endpoints Responding
        run: |
          endpoints=(
            "/api/auth/login"
            "/api/auth/register"
          )

          for endpoint in "${endpoints[@]}"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000$endpoint \
              -H "Content-Type: application/json" \
              -d '{}')

            # Expecting 400/401/422 (validation errors), not 500
            if [ "$status" = "500" ] || [ "$status" = "502" ] || [ "$status" = "503" ]; then
              echo "❌ Endpoint $endpoint returned server error: $status"
              exit 1
            fi
            echo "✅ Endpoint $endpoint responding (status: $status)"
          done

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      - name: Report smoke test results
        if: failure()
        run: |
          echo "❌ SMOKE TESTS FAILED - Critical path broken"
          echo "This indicates a fundamental issue with the application"
          exit 1

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Build, Test
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - name: Run server unit tests
        run: pnpm --filter server test:unit

      # NOTE: E2E tests (client/apps/employee/e2e/) are not run in CI.
      # They require a full stack setup: running server, database with seeded
      # test users, and the client app. Run locally with:
      #   pnpm --filter @client/employee test:e2e

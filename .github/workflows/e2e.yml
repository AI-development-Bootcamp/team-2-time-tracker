name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main, develop]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker123
          POSTGRES_DB: timetracker_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://timetracker:timetracker123@localhost:5432/timetracker_e2e
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET_TEST }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm --filter @client/employee exec playwright install --with-deps chromium

      - name: Build shared types
        run: pnpm --filter @shared/types build

      - name: Prisma generate
        run: pnpm --filter server prisma generate

      - name: Run database migrations
        run: pnpm --filter server prisma migrate deploy

      - name: Seed test database
        run: pnpm --filter server exec tsx scripts/seed-e2e.ts

      - name: Build server
        run: pnpm --filter server build

      - name: Build client packages
        run: pnpm --filter './client/packages/*' build

      - name: Build employee app
        run: pnpm --filter @client/employee build

      - name: Start backend server
        run: |
          pnpm --filter server start &
          echo $! > server.pid

      - name: Wait for server to be ready
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Waiting for server... (attempt $((attempt+1))/$max_attempts)"
            sleep 2
            attempt=$((attempt+1))
          done
          echo "Server failed to start within timeout"
          exit 1

      - name: Run E2E tests
        run: pnpm --filter @client/employee test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/apps/employee/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: client/apps/employee/test-results/
          retention-days: 30

      - name: Stop backend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ❌ E2E Tests Failed\n\nSome end-to-end tests failed. Please check the [Playwright report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
